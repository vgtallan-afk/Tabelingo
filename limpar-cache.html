<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limpar Tabelingo</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09070d;color:#f8fbff;font-family:Arial,system-ui,sans-serif;padding:24px;text-align:center}
    .box{max-width:560px;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:26px;background:rgba(255,255,255,.08)}
    h1{margin:0 0 12px;font-size:26px}p{color:#dce7f6;line-height:1.5}.btn{display:inline-block;margin:10px 6px 0;padding:14px 18px;border-radius:999px;background:#a3ff12;color:#09070d;font-weight:800;text-decoration:none;border:0}.secondary{background:#263244;color:#fff}
    .status{margin-top:14px;color:#a3ff12;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <h1>Limpar versão antiga do Tabelingo</h1>
    <p>Use esta tela só se o app antigo estiver abrindo e fechando. Ela remove service workers, cache e dados antigos do navegador.</p>
    <button class="btn" id="cleanBtn">Limpar cache antigo</button>
    <a class="btn secondary" href="./index.html?v=8-direct">Abrir Tabelingo V8</a>
    <div class="status" id="status"></div>
  </main>
  <script>
    document.getElementById('cleanBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = 'Limpando...';
      try { localStorage.clear(); } catch(e) {}
      try { sessionStorage.clear(); } catch(e) {}
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister().catch(() => null)));
        }
      } catch(e) {}
      try {
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key).catch(() => null)));
        }
      } catch(e) {}
      status.textContent = 'Limpeza concluída. Agora toque em Abrir Tabelingo V8.';
    });
  </script>
</body>
</html>
